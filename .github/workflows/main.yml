name: Deploy

on:
  push:
    branches: ["deploy"]

jobs:
  build-front-end:
    runs-on: ubuntu-latest
    needs: [build-web-api]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build web host UI image
        run: |
          cd frontend
          docker build -f Dockerfile -t room-manage/build-front-end .
          docker images
      - name: Tag and push Docker image
        run: |
          docker tag room-manage/build-front-end room-manage/build-front-end:${{ github.run_number }}
          docker push room-manage/build-front-end:${{ github.run_number }}
  build-web-api:
    runs-on: ubuntu-latest
    steps:
      - name: List files in the repository
        run: |
          echo "Current directory:"
          pwd
          echo "Listing all files and directories:"
          ls -R
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build web API image
        run: |
          cd backend/backend
          docker build -f Dockerfile -t room-manage/backend/build-web-api .
          docker images
      - name: Tag and push Docker image
        run: |
          docker tag room-manage/build-web-api room-manage/build-web-api:${{ github.run_number }}
          docker push room-manage/build-web-api:${{ github.run_number }}
