name: Deploy

on:
  push:
    branches: ["deploy"]

jobs:
  build-front-end:
    runs-on: ubuntu-latest
    needs: [build-web-api]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build web host UI image
        run: docker build ../../frontend -t room-manage/build-front-end
  build-web-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build web API image
        run: docker build -f ../../backend/backend/Dockerfile -t room-manage ../
  push-docker-image:
    runs-on: ubuntu-latest
    needs: [build-front-end, build-web-api]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag and push Docker image
        run: |
          docker tag room-manage/build-front-end khanhpro1250/room-manage/build-front-end:${{ github.run_number }}
          docker tag room-manage/build-web-api khanhpro1250/room-manage/build-web-api:${{ github.run_number }}
          docker push khanhpro1250/room-manage/build-front-end:${{ github.run_number }}
          docker push khanhpro1250/room-manage/build-web-api:${{ github.run_number }}
    if: github.ref == 'refs/heads/deploy'
